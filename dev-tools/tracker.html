<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Progress Tracker | SuA Glow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8F9FA; }
        .table-container { max-height: calc(100vh - 80px); }
    </style>
</head>
<body class="text-slate-800 h-screen flex flex-col" x-data="trackerApp()">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 shadow-sm px-6 py-4 flex flex-col md:flex-row md:items-center justify-between z-10 shrink-0 gap-4">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-slate-900 flex items-center justify-center text-white font-bold tracking-wider text-sm shadow-sm">
                SG
            </div>
            <div>
                <h1 class="text-lg font-bold leading-tight tracking-tight">Project Progress Tracker</h1>
                <p class="text-[11px] text-slate-500 uppercase tracking-widest font-semibold mt-0.5">Internal Company Info • Confidential</p>
            </div>
        </div>
        
        <!-- Filters -->
        <div class="flex gap-3 items-center">
            <div class="relative">
                <i data-lucide="list" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <select x-model="filters.status" class="pl-9 pr-8 py-2 border border-slate-200 rounded-lg text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-900 appearance-none font-medium text-slate-700">
                    <option value="">All Statuses</option>
                    <option value="Open">Open</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Pending Decision">Pending Decision</option>
                    <option value="Resolved">Resolved</option>
                </select>
                <i data-lucide="chevron-down" class="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
            </div>
            <div class="relative">
                <i data-lucide="layout" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <select x-model="filters.area" class="pl-9 pr-8 py-2 border border-slate-200 rounded-lg text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-900 appearance-none font-medium text-slate-700">
                    <option value="">All Areas</option>
                    <template x-for="area in uniqueAreas" :key="area">
                        <option :value="area" x-text="area"></option>
                    </template>
                </select>
                <i data-lucide="chevron-down" class="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
            </div>
            <div class="relative">
                <i data-lucide="user" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <select x-model="filters.assignee" class="pl-9 pr-8 py-2 border border-slate-200 rounded-lg text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-900 appearance-none font-medium text-slate-700">
                    <option value="">All Assignees</option>
                    <template x-for="assignee in uniqueAssignees" :key="assignee">
                        <option :value="assignee" x-text="assignee"></option>
                    </template>
                </select>
                <i data-lucide="chevron-down" class="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
            </div>
        </div>
    </header>

    <!-- Main Data Table -->
    <main class="flex-1 p-6 bg-slate-100/50 overflow-hidden">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 h-full flex flex-col overflow-hidden">
            <div class="overflow-x-auto flex-1 table-container">
                <table class="w-full text-left text-sm text-slate-600">
                    <thead class="bg-slate-50 text-xs uppercase text-slate-500 font-bold sticky top-0 z-10 border-b border-slate-200 shadow-sm">
                        <tr>
                            <th class="px-6 py-4">ID</th>
                            <th class="px-6 py-4">Status</th>
                            <th class="px-6 py-4">Priority</th>
                            <th class="px-6 py-4 w-1/3">Topic / Issue</th>
                            <th class="px-6 py-4 w-1/3">Action / Resolution</th>
                            <th class="px-6 py-4">Assignee</th>
                            <th class="px-6 py-4">Area</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 bg-white">
                        <template x-for="item in filteredItemsAll" :key="item.id">
                            <tr class="hover:bg-slate-50 transition-colors">
                                <td class="px-6 py-4 whitespace-nowrap text-slate-400 font-bold text-xs" x-text="'#' + item.id"></td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider"
                                          :class="{
                                            'bg-slate-100 text-slate-600': getNormalizedStatus(item) === 'Open',
                                            'bg-blue-50 text-blue-700': getNormalizedStatus(item) === 'In Progress',
                                            'bg-amber-50 text-amber-700': getNormalizedStatus(item) === 'Pending Decision',
                                            'bg-emerald-50 text-emerald-700': getNormalizedStatus(item) === 'Resolved'
                                          }"
                                          x-text="getNormalizedStatus(item)">
                                    </span>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <span class="text-[10px] font-black px-2 py-1 rounded-md uppercase tracking-widest border" 
                                          :class="{
                                            'bg-red-50 text-red-700 border-red-100': item.priority === 'High',
                                            'bg-amber-50 text-amber-700 border-amber-100': item.priority === 'Medium',
                                            'bg-emerald-50 text-emerald-700 border-emerald-100': item.priority === 'Low',
                                            'bg-slate-50 text-slate-500 border-slate-100': !item.priority || item.priority === 'nan'
                                          }"
                                          x-text="item.priority || '-'"></span>
                                </td>
                                <td class="px-6 py-4">
                                    <h3 class="font-bold text-slate-800 mb-1" x-text="item.topic"></h3>
                                    <p class="text-xs text-slate-500 line-clamp-3 whitespace-pre-wrap" x-text="item.issue"></p>
                                </td>
                                <td class="px-6 py-4">
                                    <template x-if="item.action_needed && item.action_needed !== 'nan'">
                                        <div class="mb-2">
                                            <span class="text-[9px] uppercase font-bold text-slate-400 block mb-0.5">Action Needed</span>
                                            <p class="text-xs text-slate-700 whitespace-pre-wrap" x-text="item.action_needed"></p>
                                        </div>
                                    </template>
                                    <template x-if="item.resolution && item.resolution !== 'nan'">
                                        <div>
                                            <span class="text-[9px] uppercase font-bold text-green-600 block mb-0.5">Resolution</span>
                                            <p class="text-xs text-green-700 whitespace-pre-wrap font-medium" x-text="item.resolution"></p>
                                        </div>
                                    </template>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <div class="flex items-center gap-2">
                                        <div class="w-6 h-6 rounded-full bg-slate-200 flex items-center justify-center border border-slate-300">
                                            <i data-lucide="user" class="w-3 h-3 text-slate-500"></i>
                                        </div>
                                        <span class="text-xs font-bold text-slate-700" x-text="item.assignee || 'Unassigned'"></span>
                                    </div>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <span class="text-[10px] text-slate-500 font-bold tracking-wider uppercase" x-text="item.area"></span>
                                </td>
                            </tr>
                        </template>
                        <template x-if="filteredItemsAll.length === 0">
                            <tr>
                                <td colspan="7" class="px-6 py-12 text-center text-slate-400">
                                    <div class="flex flex-col items-center justify-center">
                                        <i data-lucide="inbox" class="w-8 h-8 mb-3 text-slate-300"></i>
                                        <p class="font-medium text-sm">No items found matching your filters.</p>
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
            
            <div class="bg-slate-50 border-t border-slate-200 px-6 py-3 flex justify-between items-center text-xs text-slate-500 font-medium shrink-0">
                <span>Showing <span x-text="filteredItemsAll.length"></span> items</span>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('trackerApp', () => ({
                items: [],
                filters: {
                    status: '',
                    area: '',
                    assignee: ''
                },
                
                async init() {
                    try {
                        const response = await fetch('tracker-data.json');
                        this.items = await response.json();
                        setTimeout(() => lucide.createIcons(), 50);
                    } catch (e) {
                        console.error('Failed to load tracker data', e);
                    }
                },
                
                get uniqueAreas() {
                    return [...new Set(this.items.map(i => i.area).filter(a => a && a !== 'nan'))].sort();
                },
                
                get uniqueAssignees() {
                    return [...new Set(this.items.map(i => i.assignee).filter(a => a && a !== 'nan'))].sort();
                },
                
                getNormalizedStatus(item) {
                    let s = item.status && item.status !== 'nan' ? item.status.trim() : 'Open';
                    if (s.toLowerCase().includes('wip')) s = 'In Progress';
                    if (s.toLowerCase().includes('open')) s = 'Open';
                    return s;
                },
                
                get filteredItemsAll() {
                    const filtered = this.items.filter(item => {
                        const itemStatus = this.getNormalizedStatus(item);
                        
                        const matchesStatus = this.filters.status === '' || itemStatus === this.filters.status;
                        const matchesArea = this.filters.area === '' || item.area === this.filters.area;
                        const matchesAssignee = this.filters.assignee === '' || item.assignee === this.filters.assignee;
                        
                        return matchesStatus && matchesArea && matchesAssignee;
                    });
                    
                    // Call lucide.createIcons asynchronously after items render
                    setTimeout(() => lucide.createIcons(), 10);
                    
                    return filtered;
                }
            }));
        });
        
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });
    </script>
</body>
</html>
