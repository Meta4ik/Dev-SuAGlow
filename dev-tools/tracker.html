<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Progress Tracker | SuA Glow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8F9FA; }
        .table-container { max-height: calc(100vh - 80px); }
        .editable-field:focus { outline: none; background-color: #fff; box-shadow: 0 0 0 2px #cbd5e1; border-radius: 4px; padding: 2px 4px; margin: -2px -4px; }
        .editable-select { background-color: transparent; border: none; cursor: pointer; padding: 0; margin: 0; outline: none; font-family: inherit; font-size: inherit; font-weight: inherit; color: inherit; }
        .editable-select:focus { background-color: #fff; border-radius: 4px; box-shadow: 0 0 0 2px #cbd5e1; }
    </style>
</head>
<body class="text-slate-800 h-screen flex flex-col bg-[#F8F9FA]" x-data="trackerApp()">

    <!-- Password Overlay -->
    <div x-show="!isAuthenticated" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900" x-transition.opacity.duration.500ms style="display: none;">
        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full mx-4 text-center">
            <div class="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center mx-auto mb-6">
                <i data-lucide="lock" class="w-8 h-8 text-slate-400"></i>
            </div>
            <h2 class="text-xl font-bold text-slate-800 mb-2">Restricted Access</h2>
            <p class="text-sm text-slate-500 mb-6">Please enter the password to view this internal tracker.</p>
            
            <form @submit.prevent="checkPassword" class="space-y-4">
                <div>
                    <input type="password" x-model="passwordInput" placeholder="Enter password..." class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900 text-center font-medium" autofocus>
                </div>
                <p x-show="passwordError" class="text-xs text-red-500 font-medium" x-transition style="display: none;">Incorrect password. Please try again.</p>
                <button type="submit" class="w-full bg-slate-900 text-white font-bold py-3 rounded-lg hover:bg-slate-800 transition-colors">
                    Access Tracker
                </button>
            </form>
        </div>
    </div>

    <!-- Main Content (Hidden until authenticated) -->
    <div x-show="isAuthenticated" class="flex flex-col h-full w-full" style="display: none;">
        <!-- Header -->
        <header class="bg-white border-b border-slate-200 shadow-sm px-6 py-4 flex flex-col md:flex-row md:items-center justify-between z-10 shrink-0 gap-4">
            <div class="flex items-center gap-3">
                <div class="w-auto h-8 flex items-center justify-center">
                    <img src="../assets/logo-main.webp" alt="SuA Glow" class="h-full w-auto object-contain brightness-0">
                </div>
                <div>
                    <h1 class="text-lg font-bold leading-tight tracking-tight flex items-center gap-2">
                        Project Progress Tracker
                        <span x-show="loading" class="text-xs text-slate-400 font-normal flex items-center gap-1">
                            <i data-lucide="loader-2" class="w-3 h-3 animate-spin"></i> Syncing...
                        </span>
                    </h1>
                    <p class="text-[11px] text-slate-500 uppercase tracking-widest font-semibold mt-0.5">Internal Company Info • Confidential</p>
                </div>
            </div>
            
            <!-- Filters -->
            <div class="flex gap-3 items-center">
                <div class="relative">
                    <i data-lucide="list" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <select x-model="filters.status" class="pl-9 pr-8 py-2 border border-slate-200 rounded-lg text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-900 appearance-none font-medium text-slate-700">
                        <option value="">All Statuses</option>
                        <option value="Open">Open</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Pending Decision">Pending Decision</option>
                        <option value="Resolved">Resolved</option>
                    </select>
                    <i data-lucide="chevron-down" class="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                </div>
                <div class="relative">
                    <i data-lucide="layout" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <select x-model="filters.area" class="pl-9 pr-8 py-2 border border-slate-200 rounded-lg text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-900 appearance-none font-medium text-slate-700">
                        <option value="">All Areas</option>
                        <template x-for="area in uniqueAreas" :key="area">
                            <option :value="area" x-text="area"></option>
                        </template>
                    </select>
                    <i data-lucide="chevron-down" class="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                </div>
                <div class="relative">
                    <i data-lucide="user" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <select x-model="filters.assignee" class="pl-9 pr-8 py-2 border border-slate-200 rounded-lg text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-900 appearance-none font-medium text-slate-700">
                        <option value="">All Assignees</option>
                        <template x-for="assignee in uniqueAssignees" :key="assignee">
                            <option :value="assignee" x-text="assignee"></option>
                        </template>
                    </select>
                    <i data-lucide="chevron-down" class="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                </div>
                <button @click="logout" class="ml-2 text-slate-400 hover:text-slate-700 transition-colors" title="Lock Tracker">
                    <i data-lucide="lock" class="w-4 h-4"></i>
                </button>
                <div class="w-px h-6 bg-slate-200 mx-2"></div>
                <button @click="addNewItem" class="bg-slate-900 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-sm hover:bg-slate-800 transition-colors flex items-center gap-2">
                    <i data-lucide="plus" class="w-4 h-4"></i> New Item
                </button>
            </div>
        </header>

        <!-- Main Data Table -->
    <main class="flex-1 p-6 bg-slate-100/50 overflow-hidden">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 h-full flex flex-col overflow-hidden">
            <div class="overflow-x-auto flex-1 table-container">
                <table class="w-full text-left text-sm text-slate-600">
                    <thead class="bg-slate-50 text-xs uppercase text-slate-500 font-bold sticky top-0 z-10 border-b border-slate-200 shadow-sm">
                        <tr>
                            <th class="px-4 py-4 w-12 text-center">Done</th>
                            <th class="px-6 py-4">ID</th>
                            <th class="px-6 py-4">Status</th>
                            <th class="px-6 py-4">Priority</th>
                            <th class="px-6 py-4 w-1/3">Topic / Issue</th>
                            <th class="px-6 py-4 w-1/3">Action / Resolution</th>
                            <th class="px-6 py-4">Assignee</th>
                            <th class="px-6 py-4">Area</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 bg-white">
                        <template x-for="(item, index) in filteredItemsAll" :key="item.id">
                            <tr class="hover:bg-slate-50 transition-colors" :class="{'bg-slate-50 opacity-70': item.status === 'Resolved'}">
                                <td class="px-4 py-4 whitespace-nowrap text-center">
                                    <input type="checkbox" 
                                           class="w-4 h-4 text-emerald-600 bg-white border-slate-300 rounded focus:ring-emerald-500 cursor-pointer shadow-sm"
                                           :checked="item.status === 'Resolved'"
                                           @change="item.status = $event.target.checked ? 'Resolved' : 'Open'; updateItem(item)">
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-slate-400 font-bold text-xs" x-text="'#' + item.id"></td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <select x-model="item.status" @change="updateItem(item)" class="editable-select px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider"
                                          :class="{
                                            'bg-slate-100 text-slate-600': item.status === 'Open',
                                            'bg-blue-50 text-blue-700': item.status === 'In Progress' || item.status === 'WIP',
                                            'bg-amber-50 text-amber-700': item.status === 'Pending Decision',
                                            'bg-emerald-50 text-emerald-700': item.status === 'Resolved'
                                          }">
                                        <option value="Open">OPEN</option>
                                        <option value="In Progress">IN PROGRESS</option>
                                        <option value="Pending Decision">PENDING</option>
                                        <option value="Resolved">RESOLVED</option>
                                    </select>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <select x-model="item.priority" @change="updateItem(item)" class="editable-select text-[10px] font-black px-2 py-1 rounded-md uppercase tracking-widest border" 
                                          :class="{
                                            'bg-red-50 text-red-700 border-red-100': item.priority === 'High',
                                            'bg-amber-50 text-amber-700 border-amber-100': item.priority === 'Medium',
                                            'bg-emerald-50 text-emerald-700 border-emerald-100': item.priority === 'Low',
                                            'bg-slate-50 text-slate-500 border-slate-100': !item.priority || item.priority === 'nan'
                                          }">
                                          <option value="nan">-</option>
                                          <option value="High">HIGH</option>
                                          <option value="Medium">MEDIUM</option>
                                          <option value="Low">LOW</option>
                                    </select>
                                </td>
                                <td class="px-6 py-4">
                                    <div class="font-bold text-slate-800 mb-1 editable-field" 
                                         :class="{'line-through text-slate-500': item.status === 'Resolved'}"
                                         contenteditable="true" @blur="item.topic = $event.target.innerText; updateItem(item)" x-text="item.topic"></div>
                                    <div class="text-xs text-slate-500 whitespace-pre-wrap editable-field" 
                                         :class="{'line-through opacity-70': item.status === 'Resolved'}"
                                         contenteditable="true" @blur="item.issue = $event.target.innerText; updateItem(item)" x-text="item.issue"></div>
                                </td>
                                <td class="px-6 py-4">
                                    <div class="mb-2">
                                        <span class="text-[9px] uppercase font-bold text-slate-400 block mb-0.5">Action Needed</span>
                                        <div class="text-xs text-slate-700 whitespace-pre-wrap editable-field min-h-[1.5rem]" contenteditable="true" @blur="item.action_needed = $event.target.innerText; updateItem(item)" x-text="item.action_needed && item.action_needed !== 'nan' ? item.action_needed : ''"></div>
                                    </div>
                                    <div>
                                        <span class="text-[9px] uppercase font-bold text-green-600 block mb-0.5">Resolution</span>
                                        <div class="text-xs text-green-700 whitespace-pre-wrap font-medium editable-field min-h-[1.5rem]" contenteditable="true" @blur="item.resolution = $event.target.innerText; updateItem(item)" x-text="item.resolution && item.resolution !== 'nan' ? item.resolution : ''"></div>
                                    </div>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <div class="flex items-center gap-2">
                                        <div class="w-6 h-6 rounded-full bg-slate-200 flex items-center justify-center border border-slate-300">
                                            <i data-lucide="user" class="w-3 h-3 text-slate-500"></i>
                                        </div>
                                        <div class="text-xs font-bold text-slate-700 editable-field min-w-[3rem]" contenteditable="true" @blur="item.assignee = $event.target.innerText; updateItem(item)" x-text="item.assignee && item.assignee !== 'nan' ? item.assignee : ''"></div>
                                    </div>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <div class="text-[10px] text-slate-500 font-bold tracking-wider uppercase editable-field" contenteditable="true" @blur="item.area = $event.target.innerText; updateItem(item)" x-text="item.area && item.area !== 'nan' ? item.area : ''"></div>
                                </td>
                            </tr>
                        </template>
                        <template x-if="filteredItemsAll.length === 0 && !loading">
                            <tr>
                                <td colspan="7" class="px-6 py-12 text-center text-slate-400">
                                    <div class="flex flex-col items-center justify-center">
                                        <i data-lucide="inbox" class="w-8 h-8 mb-3 text-slate-300"></i>
                                        <p class="font-medium text-sm">No items found matching your filters.</p>
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
            
            <div class="bg-slate-50 border-t border-slate-200 px-6 py-3 flex justify-between items-center text-xs text-slate-500 font-medium shrink-0">
                <span>Showing <span x-text="filteredItemsAll.length"></span> items</span>
            </div>
        </div>
    </main>
    </div>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            projectId: "suaglow-a70fc",
            appId: "1:241093481778:web:6d859fd5b6132471ccb32b",
            storageBucket: "suaglow-a70fc.firebasestorage.app",
            apiKey: "AIzaSyAQ6d9613GUwBVsAFozZCeLXrnGGoOEeh0",
            authDomain: "suaglow-a70fc.firebaseapp.com",
            messagingSenderId: "241093481778"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        document.addEventListener('alpine:init', () => {
            Alpine.data('trackerApp', () => ({
                items: [],
                loading: true,
                isAuthenticated: sessionStorage.getItem('trackerAuth') === 'true',
                passwordInput: '',
                passwordError: false,
                filters: {
                    status: '',
                    area: '',
                    assignee: ''
                },
                
                checkPassword() {
                    // Simple hash-like check to avoid plaintext in obvious places (though it's still in the source)
                    // The password is "Glow2026!"
                    if (this.passwordInput === 'Glow2026!') {
                        this.isAuthenticated = true;
                        this.passwordError = false;
                        sessionStorage.setItem('trackerAuth', 'true');
                        // Initialize real-time updates after auth
                        this.setupFirestore();
                    } else {
                        this.passwordError = true;
                        this.passwordInput = '';
                    }
                },
                
                logout() {
                    this.isAuthenticated = false;
                    sessionStorage.removeItem('trackerAuth');
                },
                
                async addNewItem() {
                    const newId = Date.now().toString().slice(-6);
                    const newItem = {
                        id: newId,
                        status: 'Open',
                        priority: 'Medium',
                        topic: 'New Task',
                        issue: '',
                        action_needed: '',
                        resolution: '',
                        assignee: '',
                        area: 'General'
                    };
                    try {
                        this.loading = true;
                        await db.collection('tracker_items').doc(newId).set(newItem);
                    } catch (e) {
                        console.error("Error creating document: ", e);
                        alert("Failed to create new item.");
                    } finally {
                        this.loading = false;
                    }
                },

                init() {
                    if (this.isAuthenticated) {
                        this.setupFirestore();
                    }
                },
                
                setupFirestore() {
                    // Listen to Firestore real-time updates
                    db.collection('tracker_items').onSnapshot((snapshot) => {
                        if (snapshot.empty && this.items.length === 0) {
                            // Firestore is empty, auto-seed from JSON if we haven't already
                            console.log("Firestore is empty. Auto-seeding from JSON...");
                            this.seedFirestore();
                        } else if (!snapshot.empty) {
                            const newItems = [];
                            snapshot.forEach((doc) => {
                                newItems.push({ id: doc.id, ...doc.data() });
                            });
                            
                            // Sort by ID naturally
                            this.items = newItems.sort((a, b) => parseInt(a.id) - parseInt(b.id));
                            this.loading = false;
                            
                            setTimeout(() => lucide.createIcons(), 50);
                        }
                    }, (error) => {
                        console.error('Error fetching data from Firestore:', error);
                        // Fallback to local JSON if Firestore isn't set up yet
                        this.fetchFallbackData();
                    });
                },
                
                async seedFirestore() {
                    try {
                        const response = await fetch('tracker-data.json');
                        const data = await response.json();
                        for (const item of data) {
                            if (!item.id) continue;
                            await db.collection('tracker_items').doc(item.id.toString()).set(item);
                        }
                        console.log("Auto-seeding complete!");
                    } catch (e) {
                        console.error("Failed to auto-seed", e);
                    }
                },
                
                async fetchFallbackData() {
                    try {
                        const response = await fetch('tracker-data.json');
                        this.items = await response.json();
                        this.loading = false;
                        setTimeout(() => lucide.createIcons(), 50);
                    } catch (e) {
                        console.error('Failed to load fallback data', e);
                    }
                },
                
                async updateItem(item) {
                    try {
                        this.loading = true;
                        await db.collection('tracker_items').doc(item.id.toString()).set(item, { merge: true });
                    } catch (e) {
                        console.error("Error updating document: ", e);
                        alert("Failed to save changes. Make sure Firestore is enabled and rules allow writes.");
                    } finally {
                        this.loading = false;
                    }
                },
                
                get uniqueAreas() {
                    return [...new Set(this.items.map(i => i.area).filter(a => a && a !== 'nan'))].sort();
                },
                
                get uniqueAssignees() {
                    return [...new Set(this.items.map(i => i.assignee).filter(a => a && a !== 'nan'))].sort();
                },
                
                getNormalizedStatus(item) {
                    let s = item.status && item.status !== 'nan' ? item.status.trim() : 'Open';
                    if (s.toLowerCase().includes('wip')) s = 'In Progress';
                    if (s.toLowerCase().includes('open')) s = 'Open';
                    return s;
                },
                
                get filteredItemsAll() {
                    const filtered = this.items.filter(item => {
                        const itemStatus = this.getNormalizedStatus(item);
                        
                        const matchesStatus = this.filters.status === '' || itemStatus === this.filters.status;
                        const matchesArea = this.filters.area === '' || item.area === this.filters.area;
                        const matchesAssignee = this.filters.assignee === '' || item.assignee === this.filters.assignee;
                        
                        return matchesStatus && matchesArea && matchesAssignee;
                    });
                    
                    setTimeout(() => lucide.createIcons(), 10);
                    return filtered;
                }
            }));
        });
        
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });
    </script>
</body>
</html>
