<!-- Section: Consultation Policy Banner -->
<section id="consultation-policy" class="py-6 md:py-8 bg-white relative overflow-hidden">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="relative bg-[#F5EFE7] rounded-[1.75rem] sm:rounded-[2rem] overflow-hidden border border-[#E8DFC8]/60 shadow-soft animate-on-scroll fade-up">
            
            <!-- Model Image on Right: Full opacity, large, seamlessly set -->
            <div class="absolute inset-y-0 right-0 w-full sm:w-[48%] lg:w-[46%] z-0 pointer-events-none">
                <img src="{{IMAGE_SRC}}" 
                     alt="SuA Glow Personalized Aesthetic Consultation" 
                     class="w-full h-full object-cover object-[center_top] sm:object-[center_15%] lg:object-center">
            </div>

            <!-- Content Area: Compact vertical height, single line headline -->
            <div class="relative z-10 p-6 sm:p-7 md:p-8 lg:p-9 max-w-xl lg:max-w-[58%] flex flex-col justify-between">
                <div class="space-y-2.5 sm:space-y-3">
                    <span class="inline-block text-[10px] sm:text-[11px] font-bold uppercase tracking-[0.25em] text-[#9E8A73]">
                        {{BADGE_TEXT}}
                    </span>
                    
                    <h2 class="heading-wide text-2xl sm:text-[28px] lg:text-[32px] xl:text-[34px] leading-tight text-[#1A1C1E] font-normal tracking-tight whitespace-normal sm:whitespace-nowrap">
                        {{TITLE}}
                    </h2>
                    
                    <p class="font-body text-xs sm:text-[13px] text-[#5C564E] font-light leading-relaxed max-w-md">
                        {{DESCRIPTION}}
                    </p>
                    
                    <!-- $50 Consultation Fee Card: Compact Horizontal -->
                    <div class="inline-flex items-center gap-3 sm:gap-4 bg-[#EFE8DF] border border-[#E0D7CB] px-4 sm:px-5 py-2 sm:py-2.5 rounded-xl shadow-xs">
                        <div class="flex items-baseline gap-2">
                            <span class="text-2xl sm:text-[28px] font-bold text-[#1A1C1E] tracking-tight leading-none">{{FEE_AMOUNT}}</span>
                            <span class="text-[9px] sm:text-[10px] font-bold uppercase tracking-wider text-[#635C54]">{{FEE_LABEL}}</span>
                        </div>
                        
                        <div class="w-px h-5 bg-[#D6CDC2]"></div>
                        
                        <div class="text-[8.5px] sm:text-[9.5px] font-bold uppercase tracking-wider text-[#756C62] leading-tight max-w-[125px]">
                            {{CREDIT_TEXT}}
                        </div>
                    </div>
                    
                    <!-- CTA Button -->
                    <div class="pt-0.5">
                        <a href="{{CTA_LINK}}" target="_blank"
                           class="inline-flex items-center justify-center gap-2.5 bg-[#1A1C1E] hover:bg-[#2C2E30] text-white px-6 sm:px-7 py-2.5 sm:py-3 rounded-full text-xs font-semibold tracking-wider uppercase transition-all duration-300 shadow-sm hover:scale-[1.02] active:scale-[0.98]">
                            <span>{{CTA_TEXT}}</span>
                            <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                        </a>
                    </div>
                </div>
                
                <!-- Bottom Tagline & Horizontal Rule -->
                <div class="pt-4 sm:pt-5 flex items-center gap-3">
                    <span class="text-[9px] sm:text-[10px] font-bold tracking-[0.2em] text-[#8C7E6F] uppercase whitespace-nowrap">
                        {{TAGLINE}}
                    </span>
                    <div class="flex-1 h-px bg-[#D6CDC2]"></div>
                </div>
            </div>
        </div>
    </div>
</section>
