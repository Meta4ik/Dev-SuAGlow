<!-- Section: Consultation Policy Banner -->
<section id="consultation-policy" class="py-8 md:py-12 bg-white relative overflow-hidden">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="relative bg-[#F7F4EE] rounded-[2rem] sm:rounded-[2.5rem] overflow-hidden border border-[#E8DFC8]/60 shadow-soft animate-on-scroll fade-up">
            
            <!-- Background Model Image - shifted left to be prominently visible -->
            <div class="absolute inset-y-0 right-0 w-full sm:w-[60%] lg:w-[56%] z-0">
                <img src="{{IMAGE_SRC}}" 
                     alt="SuA Glow Personalized Aesthetic Consultation" 
                     class="w-full h-full object-cover object-[70%_25%] sm:object-[72%_center] lg:object-[75%_center]">
                
                <!-- Seamless Gradient Overlay: Fades into #F7F4EE on left and bottom for mobile -->
                <div class="absolute inset-0 bg-gradient-to-r from-[#F7F4EE] via-[#F7F4EE]/90 sm:via-[#F7F4EE]/60 to-transparent w-full sm:w-3/4 pointer-events-none"></div>
                <div class="absolute inset-0 bg-gradient-to-t from-[#F7F4EE]/80 via-transparent to-transparent sm:hidden pointer-events-none"></div>
            </div>

            <!-- Content Area -->
            <div class="relative z-10 p-6 sm:p-8 md:p-10 lg:p-10 max-w-xl lg:max-w-lg flex flex-col justify-between min-h-[360px] sm:min-h-[380px] lg:min-h-[400px]">
                <div class="space-y-3 sm:space-y-3.5">
                    <span class="inline-block text-[10px] sm:text-[11px] font-bold uppercase tracking-[0.25em] text-[#9E8A73]">
                        {{BADGE_TEXT}}
                    </span>
                    
                    <h2 class="heading-wide text-2xl sm:text-3xl lg:text-[36px] xl:text-[40px] leading-[1.12] text-[#1A1C1E] font-normal tracking-tight">
                        {{TITLE}}
                    </h2>
                    
                    <p class="font-body text-xs sm:text-sm text-[#5C564E] font-light leading-relaxed max-w-sm sm:max-w-md">
                        {{DESCRIPTION}}
                    </p>
                    
                    <!-- $50 Consultation Fee Card -->
                    <div class="inline-flex flex-col sm:flex-row sm:items-center gap-2.5 sm:gap-4 bg-[#EFE8DF]/95 backdrop-blur-xs border border-[#E0D7CB] px-4 sm:px-5 py-2.5 sm:py-3 rounded-2xl w-full sm:w-auto shadow-xs">
                        <div class="flex items-baseline gap-2">
                            <span class="text-2xl sm:text-3xl font-bold text-[#1A1C1E] tracking-tight leading-none">{{FEE_AMOUNT}}</span>
                            <span class="text-[10px] sm:text-[11px] font-bold uppercase tracking-wider text-[#635C54]">{{FEE_LABEL}}</span>
                        </div>
                        
                        <div class="hidden sm:block w-px h-6 bg-[#D6CDC2]"></div>
                        <div class="block sm:hidden w-full h-px bg-[#D6CDC2]"></div>
                        
                        <div class="text-[9px] sm:text-[10px] font-bold uppercase tracking-wider text-[#756C62] leading-tight sm:max-w-[125px]">
                            {{CREDIT_TEXT}}
                        </div>
                    </div>
                    
                    <!-- CTA Button -->
                    <div class="pt-1">
                        <a href="{{CTA_LINK}}" target="_blank"
                           class="inline-flex items-center justify-center gap-2.5 bg-[#1A1C1E] hover:bg-[#2C2E30] text-white px-6 sm:px-7 py-3 sm:py-3.5 rounded-full text-xs font-semibold tracking-wider uppercase transition-all duration-300 shadow-sm hover:scale-[1.02] active:scale-[0.98] w-full sm:w-auto text-center">
                            <span>{{CTA_TEXT}}</span>
                            <i data-lucide="arrow-right" class="w-4 h-4"></i>
                        </a>
                    </div>
                </div>
                
                <!-- Bottom Tagline & Horizontal Rule -->
                <div class="pt-6 sm:pt-6 flex items-center gap-3">
                    <span class="text-[9px] sm:text-[10px] font-bold tracking-[0.2em] text-[#8C7E6F] uppercase whitespace-nowrap">
                        {{TAGLINE}}
                    </span>
                    <div class="flex-1 h-px bg-[#D6CDC2]"></div>
                </div>
            </div>
        </div>
    </div>
</section>
