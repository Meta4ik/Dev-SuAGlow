<!-- Section: Brand Origin Story -->
<section id="story" class="py-32 bg-white">
    <div class="max-w-7xl mx-auto px-8">
        <div class="flex flex-col lg:flex-row items-center gap-20">
            <div class="lg:w-1/2 animate-on-scroll fade-right">
                <span class="inline-block text-[10px] tracking-[0.4em] text-taupe uppercase font-bold mb-6 italic">{{BADGE_TEXT}}</span>
                <h2 class="heading-wide text-4xl md:text-5xl text-near-black mb-10 uppercase tracking-[0.15em] [text-wrap:balance]">{{SECTION_TITLE}}</h2>
                <div class="space-y-6 font-body text-charcoal/70 leading-relaxed text-sm md:text-base font-light">
                    {{STORY_PARAGRAPHS}}
                </div>
            </div>
            <div class="lg:w-1/2 animate-on-scroll fade-left">
                <div class="aspect-square bg-off-white rounded-3xl overflow-hidden shadow-2xl relative group">
                    <img src="{{IMAGE_SRC}}" alt="{{IMAGE_ALT}}" class="w-full h-full object-cover">
                </div>
            </div>
        </div>
    </div>
</section>
