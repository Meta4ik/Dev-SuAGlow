<!-- Section: Financing & Payment Plans Widget -->
<section id="financing-widget" class="py-24 px-8 md:px-12 bg-off-white">
    <div class="max-w-4xl mx-auto">
        <div class="bg-white rounded-[2.5rem] p-8 md:p-14 border border-light-gray/40 shadow-soft animate-on-scroll fade-up flex flex-col md:flex-row items-center justify-between gap-8">
            <div class="space-y-4 max-w-lg">
                <span class="badge-standard inline-block">{{BADGE_TEXT}}</span>
                <h2 class="heading-wide text-2xl md:text-4xl text-near-black leading-tight">{{HEADLINE}}</h2>
                <p class="text-xs md:text-sm text-charcoal/70 font-light leading-relaxed">{{DESCRIPTION}}</p>
                <div class="flex flex-wrap items-center gap-3 pt-2">
                    <span class="text-[11px] font-semibold text-warm-gold bg-warm-gold/10 px-3 py-1 rounded-full">&bull; 0% APR Available</span>
                    <span class="text-[11px] font-semibold text-charcoal/70 bg-light-gray/50 px-3 py-1 rounded-full">&bull; No Hard Credit Check</span>
                    <span class="text-[11px] font-semibold text-charcoal/70 bg-light-gray/50 px-3 py-1 rounded-full">&bull; Instant Decision</span>
                </div>
            </div>

            <div class="bg-light-gray/40 p-6 rounded-2xl border border-light-gray/60 text-center min-w-[240px] space-y-4">
                <p class="text-[10px] uppercase font-bold tracking-widest text-taupe">Monthly Plans From</p>
                <p class="text-3xl font-black font-heading text-near-black">{{MONTHLY_START_PRICE}}</p>
                <a href="{{FINANCING_LINK}}" target="_blank" class="w-full btn-primary inline-flex justify-center text-xs">
                    {{CTA_TEXT}}
                </a>
            </div>
        </div>
    </div>
</section>
