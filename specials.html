<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Specials | The SUA GLOW November Edit: Chingu Friendsgiving | SUA GLOW Med Spa</title>
    <meta name="description" content="Celebrate Chingu Friendsgiving with exclusive November medical aesthetic specials at SUA GLOW in Carrollton, TX: Oligio X, Skin Quality Barrier, and HydroGlow Facial.">
    <link rel="icon" href="assets/favicon.png" type="image/png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@300;800;900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="dist/output.css?v=59">

    <!-- Google Tag & Ads Conversion Tracking -->
    <script src="google-tag.js"></script>

    <!-- Lucide Icons & html2canvas -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        .promo-card-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }
        @media (min-width: 1024px) {
            .promo-card-flex {
                display: flex;
                flex-direction: row;
                align-items: stretch;
            }
        }
    </style>
</head>

<body class="text-white antialiased relative min-h-screen" style="background: linear-gradient(180deg, #0A0C0E 0%, #0A0C0E 140px, #16191D 260px, #0E1013 45%, #060709 100%);">

    <!-- Global Navigation Placeholder -->
    <div id="nav-placeholder"></div>

    <!-- Page Header (Empty spacer for sticky nav) -->
    <section class="h-16 bg-[#0A0C0E]"></section>

    <!-- Container for Dynamically Loaded Specials Content -->
    <div id="specials-container"></div>

    <!-- Brand CTA Section -->
    <div id="nearme-placeholder"></div>

    <section id="final-consultation-cta" data-nav-theme="light" class="text-white py-28 px-10 text-center relative overflow-hidden" style="background: linear-gradient(180deg, #060709 0%, #0E1013 50%, #07080A 100%);">
        <div class="max-w-4xl mx-auto animate-on-scroll fade-up">
            <img src="assets/logo-main.webp" alt="SUA GLOW"
                class="h-16 mx-auto mb-8 brightness-0 invert opacity-70">
            <p class="heading-wide text-xs tracking-[0.7em] opacity-30 mb-20 uppercase">Medical Aesthetics • Carrollton HQ</p>
            <h3 class="heading-wide text-2xl md:text-3xl mb-8 leading-snug [text-wrap:balance]">
                K-Beauty doesn't chase trends.<br>It builds
                <span class="text-warm-gold opacity-80">better skin.</span>
            </h3>
            <a href="https://suaglow.myaestheticrecord.com/online-booking/" target="_blank"
                class="btn-primary py-3.5 px-8 text-xs font-semibold tracking-widest">
                Book Your Chingu Consultation
            </a>
        </div>
    </section>

    <!-- Global Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Shared Scripts -->
    <script src="navbar.js?v=56"></script>
    <script src="footer.js?v=50"></script>
    <script src="script.js?v=51"></script>

    <!-- Load the Specials Configuration & Renderer dynamically -->
    <script src="specials-data.js?v=128"></script>
    <script src="specials-renderer.js?v=128"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('specials-container');
            if (container && typeof renderMonthlySpecials === 'function') {
                container.innerHTML = renderMonthlySpecials();
                
                // Initialize low-key interactive mouse-following spotlight glow
                if (typeof initPromoInteractiveBackground === 'function') {
                    initPromoInteractiveBackground();
                }

                // Re-initialize Lucide icons
                if (window.lucide) {
                    lucide.createIcons();
                }
                
                // Trigger scroll animations on injected elements
                const newlyInjectedElements = container.querySelectorAll('.animate-on-scroll');
                if (typeof initScrollAnimations === 'function') {
                    initScrollAnimations();
                } else if (newlyInjectedElements.length > 0) {
                    newlyInjectedElements.forEach(el => el.classList.add('visible'));
                }
            } else {
                console.error('renderMonthlySpecials is not defined. Ensure specials-data.js and specials-renderer.js are loaded.');
            }
        });
    </script>
</body>
</html>
