<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Specials | The SUA GLOW December Edit: Seoul Much Glow | SUA GLOW Med Spa</title>
    <meta name="description" content="Cold outside, chok-chok inside! Explore exclusive December K-Beauty specials at SUA GLOW in Carrollton, TX: Korean Gyeongrak Facial Massage ($299), 60-Min K-Beauty Signature Facial ($249), and Korean Scalp & Hair Rejuvenation ($1,800).">
    <link rel="icon" href="assets/favicon.png" type="image/png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@300;600;700;800;900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="dist/output.css?v=69">

    <!-- Google Tag & Ads Conversion Tracking -->
    <script src="google-tag.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Subtle holiday champagne & snow starlight textures */
        .holiday-sparkles-light {
            background-image:
                radial-gradient(2px 2px at 14% 24%, rgba(200, 160, 85, 0.45), transparent),
                radial-gradient(2.5px 2.5px at 82% 18%, rgba(200, 160, 85, 0.35), transparent),
                radial-gradient(1.5px 1.5px at 31% 68%, rgba(158, 24, 33, 0.25), transparent),
                radial-gradient(2px 2px at 72% 72%, rgba(200, 160, 85, 0.4), transparent),
                radial-gradient(1.5px 1.5px at 54% 14%, rgba(14, 42, 26, 0.2), transparent),
                radial-gradient(2px 2px at 90% 58%, rgba(200, 160, 85, 0.35), transparent);
            background-size: 420px 320px;
        }
        .holiday-sparkles-dark {
            background-image:
                radial-gradient(1.5px 1.5px at 12% 18%, rgba(255, 245, 224, 0.55), transparent),
                radial-gradient(2px 2px at 28% 42%, rgba(232, 198, 130, 0.45), transparent),
                radial-gradient(1.5px 1.5px at 46% 12%, rgba(255, 255, 255, 0.45), transparent),
                radial-gradient(2.5px 2.5px at 68% 30%, rgba(232, 198, 130, 0.4), transparent),
                radial-gradient(1.5px 1.5px at 84% 16%, rgba(255, 255, 255, 0.5), transparent),
                radial-gradient(2px 2px at 92% 62%, rgba(232, 198, 130, 0.35), transparent),
                radial-gradient(1.5px 1.5px at 18% 76%, rgba(255, 255, 255, 0.4), transparent),
                radial-gradient(2px 2px at 56% 84%, rgba(232, 198, 130, 0.35), transparent);
            background-size: 520px 440px;
        }
    </style>
</head>

<body class="text-white antialiased relative min-h-screen bg-[#07140D]">

    <!-- Global Navigation Placeholder -->
    <div id="nav-placeholder"></div>

    <!-- Page Header (Spacer blending into frosted sage-pine holiday hero) -->
    <section class="h-16 bg-[#B5C1B8]"></section>

    <!-- Container for Dynamically Loaded Specials Content -->
    <div id="specials-container"></div>

    <!-- Brand CTA Section -->
    <div id="nearme-placeholder"></div>

    <section id="final-consultation-cta" data-nav-theme="dark" class="text-white py-28 px-10 text-center relative overflow-hidden" style="background: linear-gradient(180deg, #07140D 0%, #0E2519 50%, #07140D 100%);">
        <canvas class="holiday-snow-canvas pointer-events-none absolute inset-0 w-full h-full z-[2]" data-snow-tone="dark" data-snow-density="24" aria-hidden="true"></canvas>
        <div class="flex justify-center mb-12 relative z-10">
            <div class="flex items-center justify-center gap-4 w-full max-w-xs sm:max-w-md mx-auto">
                <span class="block flex-1" style="height: 1.5px; background: linear-gradient(90deg, transparent 0%, rgba(200, 160, 85, 0.55) 40%, #F0D28A 100%);"></span>
                <img src="assets/gold-holly-divider.svg?v=2" alt="" aria-hidden="true" class="w-8 h-8 shrink-0 object-contain drop-shadow-[0_2px_8px_rgba(200,160,85,0.4)]">
                <span class="block flex-1" style="height: 1.5px; background: linear-gradient(270deg, transparent 0%, rgba(200, 160, 85, 0.55) 40%, #F0D28A 100%);"></span>
            </div>
        </div>
        <div class="max-w-4xl mx-auto animate-on-scroll fade-up relative z-10">
            <img src="assets/logo-main.webp" alt="SUA GLOW"
                class="h-16 mx-auto mb-8 brightness-0 invert opacity-75">
            <p class="heading-wide text-xs tracking-[0.7em] opacity-40 mb-20 uppercase">Medical Aesthetics • Carrollton HQ</p>
            <h3 class="heading-wide text-2xl md:text-3xl mb-8 leading-snug [text-wrap:balance]">
                Cold outside.<br>
                <span class="text-[#E5C88B]">Chok-chok inside.</span>
            </h3>
            <a href="https://suaglow.myaestheticrecord.com/online-booking/" target="_blank"
                class="inline-flex items-center justify-center py-3.5 px-8 rounded-full text-xs font-heading font-semibold uppercase tracking-widest text-white border border-[#E5C687]/45 shadow-lg hover:brightness-110 transition-all"
                style="background: linear-gradient(135deg, #9E1821 0%, #B81F29 52%, #86121A 100%);">
                Book Your Holiday Glow Consultation
            </a>
        </div>
    </section>

    <!-- Global Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Shared Scripts -->
    <script src="navbar.js?v=56"></script>
    <script src="footer.js?v=50"></script>
    <script src="script.js?v=51"></script>

    <!-- Load the Active Specials Configuration & Renderer -->
    <script src="specials-data.js?v=146"></script>
    <script src="specials-renderer.js?v=145"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('specials-container');
            if (container && typeof renderMonthlySpecials === 'function') {
                container.innerHTML = renderMonthlySpecials();

                if (typeof initPromoInteractiveBackground === 'function') {
                    initPromoInteractiveBackground();
                }

                if (typeof initHolidaySnow === 'function') {
                    initHolidaySnow();
                }

                if (window.lucide) {
                    lucide.createIcons();
                }

                const newlyInjectedElements = container.querySelectorAll('.animate-on-scroll');
                if (typeof initScrollAnimations === 'function') {
                    initScrollAnimations();
                } else if (newlyInjectedElements.length > 0) {
                    newlyInjectedElements.forEach(el => el.classList.add('visible'));
                }
            } else {
                console.error('renderMonthlySpecials is not defined. Ensure specials-data.js and specials-renderer.js are loaded.');
            }
        });
    </script>
</body>
</html>
